[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pysmesh"
version = "2.0.0"
description = "Python bindings to SALOME SMESH ViscousLayers (boundary-layer prisms) + OCCT same-domain healing"
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-2.1-only"
authors = [{ name = "Kajetan R. Gulaj" }]
keywords = ["mesh", "cfd", "viscous-layers", "smesh", "occt", "prism"]
# NOTE: VTK is intentionally NOT a dependency. It is resolved at runtime from the host
# environment and its version is hard-checked at import; bundling or
# pip-installing a second VTK would defeat the whole purpose of pySMESH.
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # License is declared via the SPDX `license` field above (PEP 639); a `License ::`
    # classifier here would conflict with it.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/KRGulaj/pySMESH"
Source = "https://github.com/KRGulaj/pySMESH"

[tool.pytest.ini_options]
# Registered so `-m "not slow"` works locally without an unknown-marker warning. CI runs the
# whole suite; the slow tests need the git-ignored test_files/ assembly and skip without it.
markers = [
    "slow: needs the production-scale STEP assembly; minutes, not seconds",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.27"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# prepare.py (source staging + patching) must be run before the build; CI does this as an
# explicit step (see .github/workflows/ci.yml). It is not re-run by the build backend.

[tool.scikit-build.wheel]
py-api = "cp313"
packages = ["src/pysmesh"]
