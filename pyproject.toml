[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pysmesh"
# Pre-release for the TestPyPI rehearsal. Set back to "4.0.0" before tagging v4.0.0.
# ci/check_tag_version.py enforces that this matches the tag, so the two cannot drift.
# rc2 is the first rehearsal of the 3.11-3.14 matrix; rc1 was cp313 only.
version = "4.0.0rc2"
description = "Python bindings to SALOME SMESH meshing (algorithms, editing, search, medial axis) and OCCT geometry operations"
readme = "README.md"
# One wheel is built per interpreter in this range (see .github/workflows/ci.yml). pybind11
# has no Py_LIMITED_API support, so no single abi3 wheel can cover it. 3.10 is deliberately
# excluded: it reaches end of life in October 2026.
requires-python = ">=3.11"
license = "LGPL-2.1-only"
authors = [{ name = "Kajetan R. Gulaj" }]
keywords = ["mesh", "cfd", "viscous-layers", "smesh", "occt", "prism"]
# NOTE: VTK is intentionally NOT a dependency, and since 4.0.0 that is because it is
# bundled privately inside the wheel (name-mangled, alongside OCCT and Boost) rather than
# resolved from the host environment. No VTK object crosses the Python boundary
# (tests/test_vtk_privacy.py enforces this), so a private copy cannot collide with a VTK the
# host loaded for its own use. numpy is the only runtime dependency.
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # License is declared via the SPDX `license` field above (PEP 639); a `License ::`
    # classifier here would conflict with it.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/KRGulaj/pySMESH"
Source = "https://github.com/KRGulaj/pySMESH"
Issues = "https://github.com/KRGulaj/pySMESH/issues"
Changelog = "https://github.com/KRGulaj/pySMESH/releases"

[tool.pytest.ini_options]
# Registered so `-m "not slow"` works locally without an unknown-marker warning. CI runs the
# whole suite; the slow tests need the git-ignored test_files/ assembly and skip without it.
markers = [
    "slow: needs the production-scale STEP assembly; minutes, not seconds",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.27"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# prepare.py (source staging + patching) must be run before the build; CI does this as an
# explicit step (see .github/workflows/ci.yml). It is not re-run by the build backend.

[tool.scikit-build.wheel]
# NOTE: no `py-api` on purpose. `py-api = "cp313"` would tag the wheel `cp313-abi3`, which
# promises the CPython stable ABI and tells pip the wheel runs on 3.13 AND every later
# version. pybind11 does not support Py_LIMITED_API, and `pybind11_add_module` emits a
# version-locked `_core.cp313-win_amd64.pyd`, so that promise was never true: pip would
# accept the wheel on 3.14 and the import would then fail. Leaving this unset yields the
# honest `cp313-cp313` tag. `ci/check_wheel.py` asserts it and fails if abi3 ever returns.
packages = ["src/pysmesh"]
