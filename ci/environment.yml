name: pysmesh-build
# =============================================================================
# pySMESH — build-only conda environment (conda-forge ONLY)
#
# Purpose: compile _core.pyd. SMESH + KERNEL are static. Boost and VTK are dynamic, come
# from here, and are bundled into the wheel.
#
# OCCT is NOT in this env, and must not be added. ci/build_occt.py builds OCCT 8.0.1 from
# source, and CMakeLists.txt takes it only from that build (PYSMESH_OCCT_ROOT).
#
# =============================================================================
channels:
  - conda-forge
  - nodefaults
dependencies:
  # A RANGE, not a pin, and deliberately so. CI builds one wheel per interpreter and passes
  # `create-args: python=3.X` per matrix leg; an exact pin here would hand the solver two
  # conflicting python specs and make every non-3.13 leg unsolvable. The range covers the
  # supported set, so each leg's exact version narrows it instead of contradicting it.
  # Keep these bounds in lockstep with `requires-python` and the matrix in ci.yml.
  - python >=3.11,<3.15
  # --- VTK: bundled privately into the wheel since 4.0.0, no longer a host coupling ---
  # Pinned so the headers compiled against and the DLLs delvewheel bundles come from one
  # environment. It is free to move on its own schedule now: bumping it changes only what
  # ships inside the wheel, and no consumer has to follow. ci/check_vtk_pin.py asserts this
  # pin matches the binary that was actually built.
  - vtk=9.6.2
  # --- Boost: dynamic, bundled into the wheel; free to resolve ---
  - libboost-devel
  # --- build toolchain ---
  - cmake>=3.27
  - ninja
  - pybind11
  - scikit-build-core
  - pip
  # --- wheel build + DLL bundling (the whole native closure goes in) ---
  - delvewheel
  # --- PyPI metadata / README-rendering validation before any upload ---
  - twine
  # --- vendoring / patching ---
  - python-patch
  - git
  # --- testing ---
  - pytest
  - hypothesis
  - numpy
  # --- typing (stubs are part of the DoD) ---
  - mypy
